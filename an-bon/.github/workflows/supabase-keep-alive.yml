name: Supabase Keep-Alive

on:
  schedule:
    # 3일마다 1회 실행 (매 3일째 00:00 UTC / 09:00 KST)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # GitHub Actions 탭에서 수동으로 즉시 실행 가능

jobs:
  keep-alive:
    name: Supabase Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping CoffeeLike Tarot Supabase
        env:
          SUPABASE_URL: ${{ secrets.COFFEELIKE_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.COFFEELIKE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "============================================================"
          echo "🚀 [CoffeeLike Tarot] Supabase 핑(Keep-Alive) 요청 시작"
          echo "============================================================"
          
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::[CoffeeLike Tarot] Supabase URL 또는 ANON_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"

          # 1. Auth 헬스체크 엔드포인트
          AUTH_STATUS=$(curl -s -S -o /tmp/coffeelike_auth.txt -w "%{http_code}" -X GET "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo "CURL_FAILED")
          echo "Auth Status: ${AUTH_STATUS}"

          # 2. Database REST API
          DB_STATUS=$(curl -s -S -o /tmp/coffeelike_db.txt -w "%{http_code}" -X GET "${CLEAN_URL}/rest/v1/tb_customer?select=cust_id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo "CURL_FAILED")
          echo "Database Status: ${DB_STATUS}"

          if ([ "$AUTH_STATUS" -ge 200 ] && [ "$AUTH_STATUS" -lt 400 ]) || ([ "$DB_STATUS" -ge 200 ] && [ "$DB_STATUS" -lt 400 ]); then
            echo "✅ [CoffeeLike Tarot] Supabase 활성 상태 유지 성공!"
          else
            echo "::error::[CoffeeLike Tarot] Supabase 요청 실패 (Auth: ${AUTH_STATUS}, DB: ${DB_STATUS})"
            exit 1
          fi

      - name: Ping Today's Manna (Todas) Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.TODAS_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TODAS_SUPABASE_ANON_KEY }}
        run: |
          echo "============================================================"
          echo "🚀 [Today's Manna (Todas)] Supabase 핑(Keep-Alive) 요청 시작"
          echo "============================================================"
          
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::[Today's Manna (Todas)] Supabase URL 또는 ANON_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"

          # 1. Auth 헬스체크 엔드포인트
          AUTH_STATUS=$(curl -s -S -o /tmp/todas_auth.txt -w "%{http_code}" -X GET "${CLEAN_URL}/auth/v1/health" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo "CURL_FAILED")
          echo "Auth Status: ${AUTH_STATUS}"

          # 2. Database REST API
          DB_STATUS=$(curl -s -S -o /tmp/todas_db.txt -w "%{http_code}" -X GET "${CLEAN_URL}/rest/v1/manna_verses?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || echo "CURL_FAILED")
          echo "Database Status: ${DB_STATUS}"

          if ([ "$AUTH_STATUS" -ge 200 ] && [ "$AUTH_STATUS" -lt 400 ]) || ([ "$DB_STATUS" -ge 200 ] && [ "$DB_STATUS" -lt 400 ]); then
            echo "✅ [Today's Manna (Todas)] Supabase 활성 상태 유지 성공!"
          else
            echo "::error::[Today's Manna (Todas)] Supabase 요청 실패 (Auth: ${AUTH_STATUS}, DB: ${DB_STATUS})"
            exit 1
          fi
