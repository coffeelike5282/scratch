<!DOCTYPE html>

<html class="dark" lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<script>
  document.addEventListener('touchmove', function (event) {
    if (event.scale !== undefined && event.scale !== 1) {
      event.preventDefault();
    }
  }, { passive: false });
  document.addEventListener('gesturestart', function (event) {
    event.preventDefault();
  });
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .camera-overlay {
            background: linear-gradient(0deg, rgba(18,18,18,0.8) 0%, rgba(18,18,18,0) 20%, rgba(18,18,18,0) 80%, rgba(18,18,18,0.8) 100%);
        }
        .scanner-line {
            height: 2px;
            background: #ffffff;
            box-shadow: 0 0 15px 2px rgba(255, 255, 255, 0.5);
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { top: 20%; }
            50% { top: 80%; }
        }
        .shutter-active:active {
            transform: scale(0.9);
            background-color: #c8c6c5;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#303030",
                        "error": "#ffb4ab",
                        "primary-fixed": "#e5e2e1",
                        "on-tertiary-fixed": "#2d1604",
                        "surface-dim": "#131313",
                        "on-background": "#e4e2e1",
                        "surface-variant": "#353535",
                        "tertiary-fixed-dim": "#eabda0",
                        "background": "#131313",
                        "on-primary-fixed-variant": "#474646",
                        "on-error": "#690005",
                        "primary-fixed-dim": "#c8c6c5",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-primary-container": "#7e7d7d",
                        "surface-container-low": "#1b1c1c",
                        "surface": "#131313",
                        "primary": "#c8c6c5",
                        "on-tertiary": "#452a16",
                        "surface-container": "#1f2020",
                        "secondary": "#c6c6c7",
                        "on-secondary-fixed-variant": "#454747",
                        "inverse-primary": "#5f5e5e",
                        "outline": "#8e9192",
                        "on-surface": "#e4e2e1",
                        "inverse-surface": "#e4e2e1",
                        "tertiary": "#eabda0",
                        "secondary-container": "#454747",
                        "tertiary-fixed": "#ffdcc6",
                        "error-container": "#93000a",
                        "secondary-fixed": "#e2e2e2",
                        "on-secondary-container": "#b4b5b5",
                        "outline-variant": "#444748",
                        "on-tertiary-container": "#9b755c",
                        "on-secondary-fixed": "#1a1c1c",
                        "tertiary-container": "#220c00",
                        "on-secondary": "#2f3131",
                        "surface-bright": "#393939",
                        "surface-container-highest": "#353535",
                        "surface-container-high": "#2a2a2a",
                        "on-tertiary-fixed-variant": "#5f402a",
                        "primary-container": "#121212",
                        "surface-tint": "#c8c6c5",
                        "on-primary-fixed": "#1c1b1b",
                        "on-surface-variant": "#c4c7c7",
                        "on-primary": "#313030"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "base": "8px",
                        "section-gap": "40px",
                        "touch-target-min": "48px",
                        "gutter": "16px",
                        "container-margin": "24px"

                    "fontFamily": {
                        "headline-md": ["Inter"],

                },
            },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md overflow-hidden">
<!-- Top Navigation Shell -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-margin h-touch-target-min bg-background/80 backdrop-blur-md border-b border-outline-variant">
<button aria-label="Settings" class="flex items-center justify-center w-touch-target-min h-touch-target-min hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">settings</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold tracking-tighter text-on-surface">그라인드마스터</h1>
<button aria-label="Profile" class="flex items-center justify-center w-touch-target-min h-touch-target-min hover:bg-surface-container-high transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-primary">account_circle</span>
</button>
</header>
<!-- Camera Canvas -->
<main class="relative h-screen w-full bg-black flex flex-col items-center justify-center pt-touch-target-min pb-24">
<!-- Viewfinder Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-60" data-alt="A macro close-up view through a camera lens focusing on a pile of medium-grind coffee grounds on a dark metallic tray. A professional calibration card with white and grey squares is placed next to the grounds. The lighting is clinical and bright, creating high contrast between the dark grounds and the metallic surface, reflecting a technical lab-like atmosphere in a professional coffee laboratory." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDF-xSvvHAAMeLL24ma99YoGmpTA6h0yF0RTr9WveVos13aRo4CMcSPxx2KGK2YMz36sUS2xX7inGaI3uuYWWkuwrCix-A1pa8-JpcxiH82YXfV5VRLxBKhC-GH4Bj9VC0c5j0dPEZXoKpVZvHywkME9aXwZDTa6HIfOgX8C1LW_iUWpByIlDjzspa0SB-7iehZtlCo4kE4Z9VJXOgPMsu8mLSc_gTAZxxpOvZWLM-URRYSHmaAO1XXlnNanvZGiccZCBum9Gol"/>
</div>
<!-- Overlay & UI Layers -->
<div class="camera-overlay absolute inset-0 z-10"></div>
<!-- Scanning Guides -->
<div class="relative z-20 w-full max-w-md aspect-[3/4] px-container-margin flex flex-col items-center justify-center">
<!-- Floating Instruction -->
<div class="absolute top-8 left-1/2 -translate-x-1/2 w-full text-center px-4">
<span class="inline-block bg-surface-container-high/90 text-on-surface px-4 py-2 rounded-lg font-label-caps text-label-caps border border-white/20">
                    마스터 카드와 원두를 프레임 안에 맞추세요.
                </span>
</div>
<!-- Focus Frame -->
<div class="relative w-full h-full border-2 border-white/30 rounded-xl overflow-hidden flex items-center justify-center">
<!-- Scanner Line -->
<div class="scanner-line absolute left-0 right-0 z-30 opacity-50"></div>
<!-- Target Area for Card -->
<div class="w-48 h-32 border-2 border-white border-dashed rounded-lg flex flex-col items-center justify-center bg-white/5 backdrop-blur-sm">
<span class="material-symbols-outlined text-white mb-2" style="font-variation-settings: 'FILL' 1;">credit_card</span>
<span class="font-label-caps text-label-caps text-white">마스터 카드 위치</span>
</div>
</div>
</div>
<!-- Quick Controls -->
<div class="absolute bottom-32 w-full px-container-margin z-30 flex justify-between items-center max-w-lg">
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-high/60 border border-outline-variant rounded-full text-on-surface active:scale-90 transition-transform">
<span class="material-symbols-outlined">flash_on</span>
</button>
<div class="flex gap-2">
<button class="px-6 py-2 bg-white text-black font-bold text-label-caps border border-white rounded-lg active:scale-95 transition-transform">표준-85</button>
<button class="px-6 py-2 bg-transparent text-white font-bold text-label-caps border-2 border-white rounded-lg active:scale-95 transition-transform">프로-X</button>
</div>
<div class="w-12"></div> <!-- Spacer for symmetry -->
</div>
<!-- Capture Trigger -->
<div class="absolute bottom-8 z-30">
<button class="w-20 h-20 rounded-full border-4 border-white p-1 shutter-active transition-all duration-100">
<div class="w-full h-full rounded-full bg-white flex items-center justify-center">
<span class="material-symbols-outlined text-black text-4xl">photo_camera</span>
</div>
</button>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center bg-background px-container-margin pb-safe h-20 border-t border-outline-variant">
<a class="flex flex-col items-center justify-center text-on-primary-container pt-2 hover:text-on-surface group" href="#">
<span class="material-symbols-outlined group-active:scale-90 transition-transform">home</span>
<span class="font-label-caps text-label-caps mt-1">홈</span>
</a>
<!-- Active Tab: Capture (촬영) -->
<a class="flex flex-col items-center justify-center text-on-surface font-bold border-t-2 border-on-surface pt-2" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-label-caps text-label-caps mt-1">촬영</span>
</a>
<a class="flex flex-col items-center justify-center text-on-primary-container pt-2 hover:text-on-surface group" href="#">
<span class="material-symbols-outlined group-active:scale-90 transition-transform">history</span>
<span class="font-label-caps text-label-caps mt-1">기록</span>
</a>
</nav>
<script>
        // Simple micro-interaction for camera "shutter" flash
        const captureBtn = document.querySelector('.shutter-active');
        const mainOverlay = document.querySelector('.camera-overlay');

        captureBtn.addEventListener('click', () => {
            mainOverlay.style.backgroundColor = 'white';
            mainOverlay.style.opacity = '0.8';
            setTimeout(() => {
                mainOverlay.style.backgroundColor = 'transparent';
                mainOverlay.style.opacity = '1';
            }, 100);
        });
    </script>
</body></html>
