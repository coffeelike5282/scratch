</div>

<span class="font-label-caps text-[10px] text-on-surface">타겟</span>
</div>
</div>
<div class="flex items-baseline gap-1">
<span class="font-numeric-data text-numeric-data text-on-surface">0.8</span>

<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button, a').forEach(el => {
            el.addEventListener('click', (e) => {
                const ripple = document.createElement('div');
                ripple.className = 'absolute inset-0 bg-white/10 pointer-events-none opacity-0 transition-opacity duration-300';
                el.appendChild(ripple);
                setTimeout(() => ripple.classList.add('opacity-100'), 0);
                setTimeout(() => ripple.remove(), 400);
            });
        });
    </script>
